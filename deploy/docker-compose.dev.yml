services:
  backend:
    volumes:
      - ../backend:/app/backend:ro
      - ../shared:/app/shared:ro
    command: [sh, -c, 'alembic -c backend/alembic.ini upgrade head && exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --no-access-log --reload']
  model_service:
    volumes:
      - ../model_service:/app/model_service:ro
      - ../shared:/app/shared:ro
    command: [uvicorn, model_service.app.main:app, --host, 0.0.0.0, --port, '8001', --no-access-log, --reload]
